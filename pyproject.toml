[project]
name = "agentic-rag"
version = "1.0.0"
description = "Production-grade Multi-Agent RAG with Qdrant, FastEmbed, Groq, and Pydantic Logfire"
readme = "ARCHITECTURE_AND_INTERVIEW_GUIDE.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
    "pydantic>=2.8.0",
    "python-dotenv>=1.0.1",
    "groq>=0.11.0",
    "qdrant-client>=1.11.0",
    "fastembed>=0.3.4",
    "pypdf>=5.0.0",
    "requests>=2.32.0",
    "rich>=13.8.0",
    "logfire[fastapi]>=5.4.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.6.0",
]
