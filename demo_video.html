<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quorum AI — 45s Product Launch Video Studio</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Fira+Code:wght@500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-dark: #040508;
            --primary-cyan: #38bdf8;
            --primary-indigo: #818cf8;
            --accent-purple: #c084fc;
            --emerald-green: #10b981;
            --coral-red: #ef4444;
            --card-glass: rgba(13, 16, 26, 0.88);
            --border-glass: rgba(255, 255, 255, 0.16);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Plus Jakarta Sans', -apple-system, sans-serif;
            -webkit-font-smoothing: antialiased;
        }

        body {
            background-color: #020305;
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 24px;
        }

        .studio-container {
            width: 100%;
            max-width: 1140px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
        }

        .header-bar {
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 14px 24px;
            background: rgba(15, 18, 28, 0.75);
            border: 1px solid var(--border-glass);
            border-radius: 18px;
            backdrop-filter: blur(20px);
        }

        .header-title {
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 1.15rem;
            font-weight: 700;
            letter-spacing: -0.02em;
        }

        .header-title span {
            background: linear-gradient(135deg, #fff 30%, var(--primary-cyan) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .status-pill {
            font-size: 0.85rem;
            padding: 6px 14px;
            border-radius: 9999px;
            background: rgba(56, 189, 248, 0.12);
            border: 1px solid rgba(56, 189, 248, 0.35);
            color: var(--primary-cyan);
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .viewport-wrapper {
            position: relative;
            width: 100%;
            aspect-ratio: 16 / 9;
            background: #000;
            border-radius: 24px;
            overflow: hidden;
            border: 1px solid rgba(255, 255, 255, 0.18);
            box-shadow: 0 30px 80px rgba(0, 0, 0, 0.95), 0 0 50px rgba(56, 189, 248, 0.15);
        }

        canvas {
            width: 100%;
            height: 100%;
            display: block;
        }

        .controls-card {
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 18px;
            padding: 18px 26px;
            background: rgba(14, 17, 28, 0.85);
            border: 1px solid var(--border-glass);
            border-radius: 18px;
            backdrop-filter: blur(20px);
        }

        .action-group {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 12px 24px;
            border-radius: 12px;
            font-size: 0.94rem;
            font-weight: 600;
            cursor: pointer;
            border: none;
            transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .btn-primary {
            background: linear-gradient(135deg, #38bdf8 0%, #818cf8 100%);
            color: #030712;
            box-shadow: 0 4px 20px rgba(56, 189, 248, 0.45);
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 26px rgba(56, 189, 248, 0.65);
        }

        .btn-secondary {
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid var(--border-glass);
            color: #fff;
        }

        .btn-secondary:hover {
            background: rgba(255, 255, 255, 0.16);
            border-color: rgba(255, 255, 255, 0.35);
        }

        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none !important;
        }

        .progress-bar-wrap {
            flex: 1;
            min-width: 240px;
            height: 10px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 9999px;
            overflow: hidden;
            position: relative;
        }

        .progress-fill {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, #38bdf8, #818cf8, #c084fc, #10b981);
            transition: width 0.05s linear;
        }

        .time-label {
            font-family: 'Fira Code', monospace;
            font-size: 0.92rem;
            color: #94a3b8;
            min-width: 85px;
            text-align: right;
            font-weight: 600;
        }
    </style>
</head>
<body>

<div class="studio-container">
    <div class="header-bar">
        <div class="header-title">
            <svg width="24" height="24" viewBox="0 0 32 32">
                <circle cx="16" cy="16" r="11" stroke="#38bdf8" stroke-width="2" stroke-dasharray="22 6" fill="none"/>
                <circle cx="16" cy="16" r="6" stroke="#818cf8" stroke-width="1.5" stroke-dasharray="10 5" fill="none"/>
                <circle cx="16" cy="16" r="2.8" fill="#ffffff"/>
            </svg>
            <span>Quorum AI — 45s Product Launch Video Studio</span>
        </div>
        <div class="status-pill" id="statusBadge">Ready (45.0s Timeline)</div>
    </div>

    <div class="viewport-wrapper">
        <canvas id="videoCanvas" width="1920" height="1080"></canvas>
    </div>

    <div class="controls-card">
        <div class="action-group">
            <button class="btn btn-secondary" id="previewBtn" onclick="startPlayback(false)">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><polygon points="5 3 19 12 5 21 5 3"/></svg>
                <span>Preview (45s)</span>
            </button>
            <button class="btn btn-primary" id="recordBtn" onclick="startPlayback(true)">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="4" fill="currentColor"/></svg>
                <span>Record & Download 1080p Video</span>
            </button>
        </div>

        <div class="progress-bar-wrap">
            <div class="progress-fill" id="progressFill"></div>
        </div>

        <div class="time-label" id="timeLabel">0.0s / 45.0s</div>
    </div>
</div>

<script>
    const canvas = document.getElementById("videoCanvas");
    const ctx = canvas.getContext("2d");
    const progressFill = document.getElementById("progressFill");
    const timeLabel = document.getElementById("timeLabel");
    const statusBadge = document.getElementById("statusBadge");
    const previewBtn = document.getElementById("previewBtn");
    const recordBtn = document.getElementById("recordBtn");

    const TOTAL_DURATION = 45.0; // 45 Seconds Master Length
    let startTime = null;
    let isPlaying = false;
    let isRecording = false;
    let mediaRecorder = null;
    let recordedChunks = [];
    let audioCtx = null;
    let audioDest = null;

    // --- Modern Synthwave / Tech Web Audio Synthesizer ---
    function initAudio() {
        if (!audioCtx) {
            const AudioContext = window.AudioContext || window.webkitAudioContext;
            audioCtx = new AudioContext();
            audioDest = audioCtx.createMediaStreamDestination();
        }
        if (audioCtx.state === 'suspended') {
            audioCtx.resume();
        }
    }

    function playTone(freq, type = 'sine', duration = 0.2, gainVal = 0.15) {
        if (!audioCtx) return;
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = type;
        osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
        gain.gain.setValueAtTime(gainVal, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + duration);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        if (audioDest) gain.connect(audioDest);
        osc.start();
        osc.stop(audioCtx.currentTime + duration);
    }

    function playChord(chordFreqs, duration = 2.2, gainVal = 0.12) {
        chordFreqs.forEach(f => playTone(f, 'sine', duration, gainVal));
    }

    let lastSfxSec = -1;
    function triggerAudioCues(sec) {
        const curStep = Math.floor(sec * 4); // 4 checks per second
        if (curStep === lastSfxSec) return;
        lastSfxSec = curStep;

        // Subtle ambient rhythm pulse every 1 second
        if (curStep % 4 === 0 && sec > 0.5 && sec < 44) {
            playTone(85, 'triangle', 0.12, 0.08); // soft rhythmic sub
        }

        // Scene 1: Problem hook & glitch hit
        if (Math.abs(sec - 0.2) < 0.15) playTone(50, 'triangle', 1.8, 0.4);
        if (Math.abs(sec - 3.8) < 0.15) playTone(350, 'sawtooth', 0.35, 0.2);

        // Scene 2: Solution reveal
        if (Math.abs(sec - 6.6) < 0.15) playChord([220, 277.18, 329.63, 440], 2.5, 0.2);
        // Guardrail typing clicks
        if (sec >= 7.8 && sec <= 10.2 && (curStep % 2 === 0)) playTone(1400 + Math.random() * 300, 'square', 0.03, 0.04);
        // Guardrail refusal chime
        if (Math.abs(sec - 11.2) < 0.15) playTone(587.33, 'sine', 0.6, 0.18);

        // Scene 3: Dense search & Qdrant cluster
        if (Math.abs(sec - 13.6) < 0.15) playChord([261.63, 329.63, 392, 523.25], 2.2, 0.2);
        if (Math.abs(sec - 17.5) < 0.15) playTone(880, 'sine', 0.4, 0.15);

        // Scene 4: LPU Stream Explosion
        if (Math.abs(sec - 22.1) < 0.15) {
            playChord([196.00, 246.94, 293.66, 392.00], 2.8, 0.25);
            playTone(45, 'triangle', 2.0, 0.45);
        }
        // Rapid 340 tok/s sound
        if (sec >= 23.5 && sec <= 29.5 && (curStep % 1 === 0)) {
            playTone(700 + (sec * 120) % 800, 'sine', 0.04, 0.05);
        }

        // Scene 5: Critic verification chime
        if (Math.abs(sec - 31.2) < 0.15) playChord([329.63, 415.30, 493.88, 659.25], 3.0, 0.3);
        if (Math.abs(sec - 35.5) < 0.15) playChord([523.25, 659.25, 783.99, 1046.50], 2.5, 0.25);

        // Scene 6: Grand Outro Swell
        if (Math.abs(sec - 39.2) < 0.15) {
            playChord([130.81, 196.00, 261.63, 329.63, 392.00], 4.5, 0.35);
            playTone(40, 'triangle', 3.0, 0.5);
        }
    }

    // --- Particle System & Ambient Glow ---
    const particles = Array.from({ length: 110 }, () => ({
        x: Math.random() * 1920,
        y: Math.random() * 1080,
        radius: Math.random() * 2.4 + 0.6,
        vx: (Math.random() - 0.5) * 0.4,
        vy: -Math.random() * 0.5 - 0.1,
        color: Math.random() > 0.5 ? '#38bdf8' : '#818cf8',
        opacity: Math.random() * 0.7 + 0.3
    }));

    function drawAmbientBackground(t) {
        // Deep Obsidian Space Gradient
        const bg = ctx.createRadialGradient(960, 540, 150, 960, 540, 1200);
        bg.addColorStop(0, '#0c101c');
        bg.addColorStop(0.5, '#05070d');
        bg.addColorStop(1, '#020306');
        ctx.fillStyle = bg;
        ctx.fillRect(0, 0, 1920, 1080);

        // Subtle perspective grid
        ctx.save();
        ctx.strokeStyle = 'rgba(56, 189, 248, 0.035)';
        ctx.lineWidth = 1;
        const gridOffset = (t * 20) % 60;
        for (let x = 0; x < 1920; x += 60) {
            ctx.beginPath();
            ctx.moveTo(x, 0);
            ctx.lineTo(x, 1080);
            ctx.stroke();
        }
        for (let y = gridOffset; y < 1080; y += 60) {
            ctx.beginPath();
            ctx.moveTo(0, y);
            ctx.lineTo(1920, y);
            ctx.stroke();
        }
        ctx.restore();

        // Animated Nebula Swirl
        const neb = ctx.createRadialGradient(
            960 + Math.sin(t * 0.4) * 220,
            420 + Math.cos(t * 0.3) * 160,
            80,
            960, 540, 800
        );
        neb.addColorStop(0, 'rgba(56, 189, 248, 0.14)');
        neb.addColorStop(0.4, 'rgba(129, 140, 248, 0.08)');
        neb.addColorStop(1, 'rgba(0, 0, 0, 0)');
        ctx.fillStyle = neb;
        ctx.fillRect(0, 0, 1920, 1080);

        // Particle Drift
        particles.forEach(p => {
            p.x += p.vx;
            p.y += p.vy;
            if (p.y < 0) p.y = 1080;
            if (p.x < 0) p.x = 1920;
            if (p.x > 1920) p.x = 0;

            ctx.fillStyle = p.color;
            ctx.globalAlpha = p.opacity * (0.6 + 0.4 * Math.sin(t * 2 + p.x));
            ctx.beginPath();
            ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
            ctx.fill();
        });
        ctx.globalAlpha = 1.0;
    }

    // --- Helper: macOS Window Chrome Wrapper ---
    function drawMacWindow(x, y, w, h, title = "Quorum AI — Research Terminal") {
        ctx.save();
        // Glass Body
        ctx.fillStyle = 'rgba(12, 15, 25, 0.88)';
        ctx.strokeStyle = 'rgba(255, 255, 255, 0.18)';
        ctx.lineWidth = 1.5;
        ctx.shadowColor = 'rgba(0, 0, 0, 0.85)';
        ctx.shadowBlur = 45;
        roundRect(ctx, x, y, w, h, 20, true, true);
        ctx.shadowBlur = 0;

        // Window Title Bar
        ctx.fillStyle = 'rgba(255, 255, 255, 0.04)';
        roundRect(ctx, x, y, w, 44, 20, true, false);

        // macOS Traffic Lights
        ctx.fillStyle = '#ff5f56'; ctx.beginPath(); ctx.arc(x + 24, y + 22, 6, 0, Math.PI * 2); ctx.fill();
        ctx.fillStyle = '#ffbd2e'; ctx.beginPath(); ctx.arc(x + 44, y + 22, 6, 0, Math.PI * 2); ctx.fill();
        ctx.fillStyle = '#27c93f'; ctx.beginPath(); ctx.arc(x + 64, y + 22, 6, 0, Math.PI * 2); ctx.fill();

        // Title
        ctx.fillStyle = '#94a3b8';
        ctx.font = '600 14px "Plus Jakarta Sans"';
        ctx.textAlign = 'center';
        ctx.fillText(title, x + w / 2, y + 27);
        ctx.restore();
    }

    // --- Helper: Animated Quantum Orbital Emblem ---
    function drawQuantumLogo(cx, cy, radius, t) {
        ctx.save();
        ctx.translate(cx, cy);

        // Outer Ring
        ctx.save();
        ctx.rotate(t * 0.7);
        ctx.strokeStyle = '#38bdf8';
        ctx.lineWidth = 4;
        ctx.setLineDash([42, 18]);
        ctx.shadowColor = '#38bdf8';
        ctx.shadowBlur = 28;
        ctx.beginPath();
        ctx.arc(0, 0, radius, 0, Math.PI * 2);
        ctx.stroke();
        ctx.restore();

        // Inner Counter Ring
        ctx.save();
        ctx.rotate(-t * 1.3);
        ctx.strokeStyle = '#818cf8';
        ctx.lineWidth = 3;
        ctx.setLineDash([26, 14]);
        ctx.shadowColor = '#818cf8';
        ctx.shadowBlur = 20;
        ctx.beginPath();
        ctx.arc(0, 0, radius * 0.62, 0, Math.PI * 2);
        ctx.stroke();
        ctx.restore();

        // Glowing Core
        ctx.fillStyle = '#ffffff';
        ctx.shadowColor = '#ffffff';
        ctx.shadowBlur = 32;
        ctx.beginPath();
        ctx.arc(0, 0, radius * 0.22, 0, Math.PI * 2);
        ctx.fill();

        ctx.restore();
    }

    // --- Rounded Rect Utility ---
    function roundRect(ctx, x, y, width, height, radius, fill, stroke) {
        ctx.beginPath();
        ctx.moveTo(x + radius, y);
        ctx.lineTo(x + width - radius, y);
        ctx.quadraticCurveTo(x + width, y, x + width, y + radius);
        ctx.lineTo(x + width, y + height - radius);
        ctx.quadraticCurveTo(x + width, y + height, x + width - radius, y + height);
        ctx.lineTo(x + radius, y + height);
        ctx.quadraticCurveTo(x, y + height, x, y + height - radius);
        ctx.lineTo(x, y + radius);
        ctx.quadraticCurveTo(x, y, x + radius, y);
        ctx.closePath();
        if (fill) ctx.fill();
        if (stroke) ctx.stroke();
    }

    // =========================================================================
    // 45-SECOND CINEMATIC DIRECTOR (6 DETAILED CHAPTERS)
    // =========================================================================
    function renderFrame(sec) {
        ctx.clearRect(0, 0, 1920, 1080);
        drawAmbientBackground(sec);
        triggerAudioCues(sec);

        // -------------------------------------------------------------
        // CHAPTER 1 (0.0s - 6.5s): THE PROBLEM — SILENT HALLUCINATIONS
        // -------------------------------------------------------------
        if (sec >= 0.0 && sec < 6.5) {
            const t = sec;
            const fadeIn = Math.min(1, t * 2.0);
            const fadeOut = Math.max(0, 1 - (t - 5.6) * 1.8);
            ctx.globalAlpha = fadeIn * fadeOut;

            // Problem Tag
            ctx.fillStyle = 'rgba(239, 68, 68, 0.16)';
            ctx.strokeStyle = 'rgba(239, 68, 68, 0.6)';
            ctx.lineWidth = 1.5;
            roundRect(ctx, 740, 220, 440, 46, 23, true, true);
            ctx.fillStyle = '#f87171';
            ctx.font = '700 17px "Plus Jakarta Sans"';
            ctx.textAlign = 'center';
            ctx.fillText('⚠ THE ENTERPRISE RAG BOTTLENECK', 960, 250);

            // Headline
            ctx.fillStyle = '#ffffff';
            ctx.font = '800 64px "Plus Jakarta Sans"';
            ctx.shadowColor = 'rgba(0,0,0,0.85)';
            ctx.shadowBlur = 24;
            ctx.fillText('Most RAG Systems Hallucinate', 960, 360);

            ctx.fillStyle = '#94a3b8';
            ctx.font = '500 30px "Plus Jakarta Sans"';
            ctx.shadowBlur = 0;
            ctx.fillText('When context is missing, standard models fabricate false formulas.', 960, 420);

            // Mock Warning Split Card
            drawMacWindow(460, 490, 1000, 340, "Standard RAG Output vs Reality");

            ctx.fillStyle = 'rgba(239, 68, 68, 0.08)';
            ctx.strokeStyle = 'rgba(239, 68, 68, 0.4)';
            ctx.lineWidth = 1;
            roundRect(ctx, 500, 560, 920, 120, 14, true, true);

            ctx.fillStyle = '#f87171';
            ctx.font = '600 20px "Plus Jakarta Sans"';
            ctx.textAlign = 'left';
            ctx.fillText('❌ Fabricated Mathematical Claim:', 530, 600);
            ctx.fillStyle = '#ffffff';
            ctx.font = '400 18px "Fira Code"';
            ctx.fillText('"Variance of X is always bounded by E[X] * √N in high dimensions..."', 530, 640);

            ctx.fillStyle = '#ef4444';
            ctx.font = '700 18px "Plus Jakarta Sans"';
            ctx.textAlign = 'center';
            ctx.fillText('🚫 Fatal in Medical, Financial, and Scientific Research', 960, 750);

            ctx.globalAlpha = 1.0;
        }

        // -------------------------------------------------------------
        // CHAPTER 2 (6.5s - 13.5s): THE SOLUTION & FIRST LINE OF DEFENSE
        // -------------------------------------------------------------
        else if (sec >= 6.5 && sec < 13.5) {
            const t = sec - 6.5;
            const fadeIn = Math.min(1, t * 2.0);
            const fadeOut = Math.max(0, 1 - (t - 6.2) * 2.0);
            ctx.globalAlpha = fadeIn * fadeOut;

            // Brand Reveal
            drawQuantumLogo(960, 180, 52, sec);

            ctx.fillStyle = '#ffffff';
            ctx.font = '800 54px "Plus Jakarta Sans"';
            ctx.textAlign = 'center';
            ctx.shadowColor = 'rgba(56, 189, 248, 0.5)';
            ctx.shadowBlur = 35;
            ctx.fillText('Quorum AI — Self-Auditing RAG', 960, 275);
            ctx.shadowBlur = 0;

            ctx.fillStyle = '#38bdf8';
            ctx.font = '600 24px "Plus Jakarta Sans"';
            ctx.fillText('Stage 1: Input Domain Guardrail Router', 960, 320);

            // Window Terminal
            drawMacWindow(420, 360, 1080, 460, "Domain Guardrail Intent Classification");

            // User typing an off-topic question
            ctx.fillStyle = 'rgba(255, 255, 255, 0.05)';
            roundRect(ctx, 470, 430, 980, 70, 14, true, false);

            const promptText = "How do I bake a sourdough pizza with yeast?";
            const typedLen = Math.min(promptText.length, Math.floor((t - 0.8) * 24));
            const currentPrompt = promptText.substring(0, Math.max(0, typedLen));

            ctx.fillStyle = '#94a3b8';
            ctx.font = '600 16px "Plus Jakarta Sans"';
            ctx.textAlign = 'left';
            ctx.fillText('User Prompt:', 500, 460);

            ctx.fillStyle = '#ffffff';
            ctx.font = '500 20px "Plus Jakarta Sans"';
            ctx.fillText(currentPrompt, 500, 485);

            // Guardrail Decision Box
            if (t >= 2.6) {
                const decFade = Math.min(1, (t - 2.6) * 3);
                ctx.globalAlpha = fadeIn * fadeOut * decFade;

                ctx.fillStyle = 'rgba(245, 158, 11, 0.12)';
                ctx.strokeStyle = '#f59e0b';
                ctx.lineWidth = 1.5;
                roundRect(ctx, 470, 530, 980, 150, 14, true, true);

                ctx.fillStyle = '#fbbf24';
                ctx.font = '700 20px "Plus Jakarta Sans"';
                ctx.fillText('🛡️ Domain Guardrail Triggered: Off-Topic Refusal (0.05s)', 500, 570);

                ctx.fillStyle = '#e2e8f0';
                ctx.font = '400 16px "Plus Jakarta Sans"';
                ctx.fillText('• Class: General Culinary (Blocked from Vector DB)', 500, 605);
                ctx.fillText('• Reason: Saves 100% of GPU compute & prevents vector embedding drift.', 500, 635);

                // Zero cost badge
                ctx.fillStyle = 'rgba(16, 185, 129, 0.2)';
                ctx.strokeStyle = '#10b981';
                roundRect(ctx, 500, 700, 320, 40, 20, true, true);
                ctx.fillStyle = '#10b981';
                ctx.font = '700 15px "Plus Jakarta Sans"';
                ctx.fillText('⚡ 0 Vector Cost • 0ms Delay', 525, 725);
            }

            ctx.globalAlpha = 1.0;
        }

        // -------------------------------------------------------------
        // CHAPTER 3 (13.5s - 22.0s): DENSE VECTOR RETRIEVAL (QDRANT CLOUD)
        // -------------------------------------------------------------
        else if (sec >= 13.5 && sec < 22.0) {
            const t = sec - 13.5;
            const fadeIn = Math.min(1, t * 2.0);
            const fadeOut = Math.max(0, 1 - (t - 7.5) * 2.0);
            ctx.globalAlpha = fadeIn * fadeOut;

            ctx.fillStyle = 'rgba(6, 182, 212, 0.15)';
            ctx.strokeStyle = 'rgba(6, 182, 212, 0.45)';
            ctx.lineWidth = 1.5;
            roundRect(ctx, 740, 140, 440, 42, 21, true, true);
            ctx.fillStyle = '#22d3ee';
            ctx.font = '700 16px "Plus Jakarta Sans"';
            ctx.textAlign = 'center';
            ctx.fillText('STAGE 2: DENSE CLOUD RETRIEVAL', 960, 167);

            ctx.fillStyle = '#ffffff';
            ctx.font = '800 52px "Plus Jakarta Sans"';
            ctx.fillText('Scanning Qdrant Cloud HNSW Cluster', 960, 240);

            ctx.fillStyle = '#94a3b8';
            ctx.font = '500 22px "Plus Jakarta Sans"';
            ctx.fillText('BAAI/bge-small-en-v1.5 Bi-Encoder (384 Dimensions) • Sub-15ms Latency', 960, 285);

            drawMacWindow(380, 330, 1160, 520, "Qdrant Cloud Vector Search (HNSW Cosine Metric)");

            // Query Card

    // =========================================================================
    // PLAYBACK & 1080P RECORDING ENGINE
    // =========================================================================
    function startPlayback(recordingMode) {
        if (isPlaying) return;
        isPlaying = true;
        isRecording = recordingMode;
        startTime = performance.now();
        lastSfxSec = -1;

        initAudio();

        previewBtn.disabled = true;
        recordBtn.disabled = true;

        if (isRecording) {
            statusBadge.innerText = "🔴 Recording 1080p Video (45s)...";
            statusBadge.style.color = "#ef4444";
            statusBadge.style.borderColor = "rgba(239, 68, 68, 0.4)";
            statusBadge.style.background = "rgba(239, 68, 68, 0.12)";
            startMediaRecorder();
        } else {
            statusBadge.innerText = "▶ Playing 45s Preview...";
            statusBadge.style.color = "#38bdf8";
        }

        requestAnimationFrame(tick);
    }

    function tick(now) {
        const elapsed = (now - startTime) / 1000;
        const progress = Math.min(1, elapsed / TOTAL_DURATION);

        progressFill.style.width = (progress * 100) + '%';
        timeLabel.innerText = `${elapsed.toFixed(1)}s / ${TOTAL_DURATION.toFixed(1)}s`;

        renderFrame(elapsed);

        if (elapsed < TOTAL_DURATION) {
            requestAnimationFrame(tick);
        } else {
            finishPlayback();
        }
    }

    function finishPlayback() {
        isPlaying = false;
        previewBtn.disabled = false;
        recordBtn.disabled = false;

        if (isRecording && mediaRecorder && mediaRecorder.state !== "inactive") {
            mediaRecorder.stop();
        } else {
            statusBadge.innerText = "✓ 45s Preview Completed";
            statusBadge.style.color = "#10b981";
        }
    }

    function startMediaRecorder() {
        recordedChunks = [];
        const canvasStream = canvas.captureStream(30);

        const combinedStream = new MediaStream([
            ...canvasStream.getVideoTracks(),
            ...(audioDest ? audioDest.stream.getAudioTracks() : [])
        ]);

        const mimeType = MediaRecorder.isTypeSupported('video/webm;codecs=vp9,opus')
            ? 'video/webm;codecs=vp9,opus'
            : (MediaRecorder.isTypeSupported('video/mp4') ? 'video/mp4' : 'video/webm');

        mediaRecorder = new MediaRecorder(combinedStream, {
            mimeType: mimeType,
            videoBitsPerSecond: 8000000 // 8 Mbps high-fidelity 1080p
        });

        mediaRecorder.ondataavailable = (e) => {
            if (e.data && e.data.size > 0) recordedChunks.push(e.data);
        };

        mediaRecorder.onstop = () => {
            const blob = new Blob(recordedChunks, { type: mimeType });
            const url = URL.createObjectURL(blob);
            const a = document.createElement("a");
            a.href = url;
            const ext = mimeType.includes('mp4') ? 'mp4' : 'webm';
            a.download = `quorum_ai_launch_demo_45s.${ext}`;
            a.click();
            URL.revokeObjectURL(url);

            statusBadge.innerText = "✓ 45s Video Downloaded!";
            statusBadge.style.color = "#10b981";
            statusBadge.style.borderColor = "rgba(16, 185, 129, 0.4)";
            statusBadge.style.background = "rgba(16, 185, 129, 0.12)";
        };

        mediaRecorder.start();
    }

    // Render initial poster frame
    renderFrame(35.0);
